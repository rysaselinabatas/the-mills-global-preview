name: Build blog and news pages

on:
  push:
    branches: [main]
    paths:
      - 'content/posts/**'
      - 'assets/images/blog/**'
      - 'tools/build-content.py'
      - 'tools/mdhtml.py'
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: build-content
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Pillow
        run: pip install pillow
      - name: Build pages
        run: SKIP_FETCH=1 python3 tools/build-content.py
      - name: Commit generated pages
        run: |
          git config user.name "mills-content-bot"
          git config user.email "mills-content-bot@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing to commit"
          else
            git commit -m "Rebuild blog and news pages [skip ci]"
            git push
          fi
      - name: Trigger Pages build
        continue-on-error: true
        run: gh api -X POST repos/${{ github.repository }}/pages/builds
        env:
          GH_TOKEN: ${{ github.token }}
